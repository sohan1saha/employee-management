# ==============================================================================
# StaffSync 360 - Automated Enterprise GitHub Actions CI/CD Pipeline
# ==============================================================================

name: StaffSync 360 CI Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

jobs:
  # Job 1: Code Linting & Static Formatting
  lint:
    name: Code Lint & Format Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Linting Tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff

      - name: Run Ruff Linter
        run: |
          ruff check . --ignore E501,F401,E402

  # Job 2: Security & Static Vulnerability Scan
  security-scan:
    name: AST Security & Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Security Scanners
        run: |
          python -m pip install --upgrade pip
          pip install bandit pip-audit

      - name: Run Bandit AST Vulnerability Scan
        run: |
          bandit -r app/ -ll --exclude app/web

      - name: Run Pip Audit Dependency Check
        run: |
          pip install -r requirements.txt
          pip-audit || true

  # Job 3: Integration Tests against Real PostgreSQL 16 & Redis 7
  test:
    name: Test Suite (Python ${{ matrix.python-version }})
    needs: [lint, security-scan]
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: staffsync_admin
          POSTGRES_PASSWORD: staffsync_ci_test_password
          POSTGRES_DB: staffsync_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Integration Tests with PostgreSQL & Coverage
        env:
          DATABASE_URL: postgresql://staffsync_admin:staffsync_ci_test_password@localhost:5432/staffsync_test_db
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: ci_pipeline_test_secret_key_random_for_testing_purposes_min32chars
          ENVIRONMENT: development
        run: |
          python -m pytest tests/ -v --cov=app --cov-report=term-missing --cov-report=xml

  # Job 4: Multi-stage Docker Container Build Verification
  docker-build:
    name: Docker Image Build Verification
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Container
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: staffsync360:latest
