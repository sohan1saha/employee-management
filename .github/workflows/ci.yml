# ==============================================================================
# StaffSync 360 - Automated Enterprise GitHub Actions CI/CD Pipeline
# ==============================================================================

name: StaffSync 360 CI Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

jobs:
  # Job 1: Code Linting & Static Formatting
  lint:
    name: Code Lint & Format Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Linting Tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff

      - name: Run Ruff Linter
        run: |
          ruff check . --ignore E501,F401,E402

  # Job 2: Secret Scanning (TruffleHog)
  secret-scan:
    name: Secret & Credential Leak Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run TruffleHog Secret Scanner
        uses: trufflesecurity/trufflehog@main
        with:
          extra_args: --only-verified --exclude-paths=.env.example,DEMO_CREDENTIALS.pdf

  # Job 3: AST Security & Dependency Audit
  security-scan:
    name: AST Security & Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Security Scanners
        run: |
          python -m pip install --upgrade pip
          pip install bandit pip-audit

      - name: Run Bandit AST Vulnerability Scan
        run: |
          bandit -r app/ -ll --exclude app/web

      - name: Run Pip Audit Dependency Check
        run: |
          pip install -r requirements.txt
          pip-audit --desc on

  # Job 4: Integration Tests against Real PostgreSQL 16 & Redis 7
  test:
    name: Test Suite (Python ${{ matrix.python-version }})
    needs: [lint, secret-scan, security-scan]
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: staffsync_admin
          POSTGRES_PASSWORD: staffsync_ci_test_password
          POSTGRES_DB: staffsync_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Alembic Migrations against Real PostgreSQL
        env:
          DATABASE_URL: postgresql://staffsync_admin:staffsync_ci_test_password@localhost:5432/staffsync_test_db
        run: |
          alembic upgrade head

      - name: Run Integration Tests with PostgreSQL, Redis & Coverage
        env:
          DATABASE_URL: postgresql://staffsync_admin:staffsync_ci_test_password@localhost:5432/staffsync_test_db
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: ci_pipeline_test_secret_key_random_for_testing_purposes_min32chars
          ENVIRONMENT: development
        run: |
          python -m pytest tests/ -v --cov=app --cov-report=term-missing --cov-report=xml

  # Job 5: Multi-stage Docker Container Build & Trivy Vulnerability Scan
  docker-build-and-scan:
    name: Docker Image Build & Trivy Scan
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Container
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: staffsync360:latest

      - name: Run Trivy Container Security Scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'staffsync360:latest'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'
