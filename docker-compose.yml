# ==============================================================================
# StaffSync 360 - Production Multi-Container Docker Compose Stack
# ==============================================================================

version: '3.8'

services:
  # 1. FastAPI Application Server
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: staffsync_app
    restart: unless-stopped
    environment:
      - ENVIRONMENT=production
      - DEBUG=False
      - DATABASE_URL=postgresql://staffsync_admin:staffsync_secure_pass@db:5432/staffsync_db
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=${SECRET_KEY:-staffsync_prod_jwt_super_secret_enterprise_key_2026}
      - ACCESS_TOKEN_EXPIRE_MINUTES=480
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - staffsync_net
    expose:
      - "8000"

  # 2. Clustered PostgreSQL 16 Database
  db:
    image: postgres:16-alpine
    container_name: staffsync_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: staffsync_admin
      POSTGRES_PASSWORD: staffsync_secure_pass
      POSTGRES_DB: staffsync_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - staffsync_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U staffsync_admin -d staffsync_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 3. Redis 7 High-Speed In-Memory Cache & Message Broker
  redis:
    image: redis:7-alpine
    container_name: staffsync_redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    networks:
      - staffsync_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 4. NGINX Reverse Proxy with SSL, Gzip & Rate Limiting
  nginx:
    image: nginx:alpine
    container_name: staffsync_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app
    networks:
      - staffsync_net

networks:
  staffsync_net:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
