# ==============================================================================
# StaffSync 360 - Production Multi-Container Docker Compose Stack
# ==============================================================================

version: '3.8'

services:
  # 1. FastAPI Application Server
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: staffsync_app
    restart: unless-stopped
    environment:
      - ENVIRONMENT=production
      - DEBUG=False
      - DATABASE_URL=postgresql://${POSTGRES_USER:-staffsync_admin}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be configured in .env}@db:5432/${POSTGRES_DB:-staffsync_db}
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY must be configured in .env}
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES:-15}
      - REFRESH_TOKEN_EXPIRE_DAYS=${REFRESH_TOKEN_EXPIRE_DAYS:-7}
      - COOKIE_SECURE=True
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - staffsync_net
    expose:
      - "8000"

  # 2. Clustered PostgreSQL 16 Database
  db:
    image: postgres:16-alpine
    container_name: staffsync_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-staffsync_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be configured in .env}
      POSTGRES_DB: ${POSTGRES_DB:-staffsync_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - staffsync_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-staffsync_admin} -d ${POSTGRES_DB:-staffsync_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 3. Redis 7 High-Speed In-Memory Cache & Message Broker
  redis:
    image: redis:7-alpine
    container_name: staffsync_redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    networks:
      - staffsync_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 4. NGINX Reverse Proxy with SSL/TLS Termination, Gzip & Rate Limiting
  nginx:
    image: nginx:alpine
    container_name: staffsync_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./deploy/ssl:/etc/nginx/ssl:ro
      - ./deploy/certbot/www:/var/www/certbot:ro
      - ./deploy/certbot/conf:/etc/letsencrypt:ro
    depends_on:
      - app
    networks:
      - staffsync_net

  # 5. Automated Periodic PostgreSQL Backup Daemon
  backup:
    image: postgres:16-alpine
    container_name: staffsync_backup
    restart: unless-stopped
    environment:
      POSTGRES_HOST: db
      POSTGRES_USER: ${POSTGRES_USER:-staffsync_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be configured in .env}
      POSTGRES_DB: ${POSTGRES_DB:-staffsync_db}
      RETENTION_DAYS: 7
      ENCRYPTION_PASSPHRASE: ${ENCRYPTION_PASSPHRASE:-}
    volumes:
      - ./scripts/backup_db.sh:/usr/local/bin/backup_db.sh:ro
      - backups_data:/backups
    entrypoint: |
      /bin/sh -c '
        echo "0 2 * * * /bin/sh /usr/local/bin/backup_db.sh" > /etc/crontabs/root
        echo "[+] Automated backup daemon started. Running daily at 02:00 AM UTC."
        crond -f -l 2
      '
    depends_on:
      db:
        condition: service_healthy
    networks:
      - staffsync_net

networks:
  staffsync_net:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  backups_data:
